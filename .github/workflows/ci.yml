name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - run: flutter pub get

      - name: Validate Sentry symbol-upload configuration
        if: github.event_name == 'push' && vars.SENTRY_DSN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::SENTRY_DSN is configured, but SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is missing."
            exit 1
          fi

      - name: Build iOS (${{ matrix.flavor }})
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
        run: flutter build ios --flavor ${{ matrix.flavor }} --no-codesign --dart-define=APP_ENV=${{ matrix.flavor }} --dart-define=SENTRY_DSN=$SENTRY_DSN --split-debug-info=build/sentry-symbols/${{ matrix.flavor }}

      - name: Upload iOS debug symbols to Sentry
        if: github.event_name == 'push' && vars.SENTRY_DSN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: dart run sentry_dart_plugin

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - run: flutter pub get

      - name: Validate Sentry symbol-upload configuration
        if: github.event_name == 'push' && vars.SENTRY_DSN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::error::SENTRY_DSN is configured, but SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is missing."
            exit 1
          fi

      - name: Build Android (${{ matrix.flavor }})
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
        run: flutter build apk --flavor ${{ matrix.flavor }} --dart-define=APP_ENV=${{ matrix.flavor }} --dart-define=SENTRY_DSN=$SENTRY_DSN --split-debug-info=build/sentry-symbols/${{ matrix.flavor }}

      - name: Upload Android debug symbols to Sentry
        if: github.event_name == 'push' && vars.SENTRY_DSN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: dart run sentry_dart_plugin
